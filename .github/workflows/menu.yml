# Questo file dice a GitHub QUANDO e COME lanciare il bot.
name: Menu mensa

on:
  # GitHub ragiona in ora inglese (UTC), che cambia rispetto all'Italia con l'ora legale.
  # Quindi lo facciamo partire due volte e, sotto, teniamo solo quella delle 7 italiane.
  schedule:
    # (minuto 17 e non 00: allo scoccare dell'ora GitHub è affollato e ritarda di più)
    - cron: "17 5 * * *"   # 7:17 in Italia d'estate
    - cron: "17 6 * * *"   # 7:17 in Italia d'inverno
  # Permette di lanciarlo a mano dal sito di GitHub (pulsante "Run workflow")
  workflow_dispatch:

jobs:
  invia-menu:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - name: È l'ora giusta in Italia?
        id: orario
        run: |
          ORA=$(date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$ORA" = "07" ]; then
            echo "vai=si" >> "$GITHUB_OUTPUT"
          else
            echo "Sono le $ORA in Italia: questa partenza la salto."
            echo "vai=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Scarica il codice del bot
        if: steps.orario.outputs.vai == 'si'
        uses: actions/checkout@v4

      - name: Prepara Python
        if: steps.orario.outputs.vai == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        if: steps.orario.outputs.vai == 'si'
        run: pip install -r requirements.txt

      - name: Manda il menu su Telegram
        if: steps.orario.outputs.vai == 'si'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
