# Questo file dice a GitHub QUANDO e COME lanciare il bot.
name: Menu mensa

on:
  # GitHub ragiona in ora inglese (UTC), che cambia rispetto all'Italia con l'ora legale.
  # In più a volte parte in ritardo (anche di un'ora) o salta una partenza.
  # Quindi lo facciamo partire tre volte: la prima che arriva tra le 7 e le 11 italiane
  # manda il menu, le altre vedono che oggi è già fatto e si fermano.
  schedule:
    - cron: "15 5 * * *"   # 7:15 in Italia d'estate (6:15 d'inverno: troppo presto, salta)
    - cron: "15 6 * * *"   # 7:15 in Italia d'inverno (8:15 d'estate: riserva)
    - cron: "15 7 * * *"   # riserva: 8:15 d'inverno, 9:15 d'estate
  # Permette di lanciarlo a mano dal sito di GitHub (pulsante "Run workflow")
  workflow_dispatch:
  # Quando cambi la pagina (cartella docs/), la ripubblica subito, senza leggere il menu
  push:
    branches: [main]
    paths: ["docs/**"]

# Il bot può salvare menu.json nel repository e pubblicare la pagina
permissions:
  contents: write
  pages: write
  id-token: write

# Mai due pubblicazioni contemporanee
concurrency:
  group: pagina
  cancel-in-progress: false

jobs:
  # 1) Decide cosa fare
  orario:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    outputs:
      vai: ${{ steps.controllo.outputs.vai }}
      leggi: ${{ steps.controllo.outputs.leggi }}
    steps:
      # Serve solo menu.json, per sapere se il menu di oggi è già stato mandato
      - name: Scarica menu.json
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/menu.json
          sparse-checkout-cone-mode: false

      - name: È l'ora giusta in Italia?
        id: controllo
        run: |
          ORA=$(date +%H)
          OGGI=$(date +%F)   # es. 2026-11-06
          EVENTO="${{ github.event_name }}"
          # La data scritta in menu.json dall'ultima volta che il bot ha letto il menu
          ULTIMA=$(python3 -c "import json; print(json.load(open('docs/menu.json')).get('data', ''))" 2>/dev/null || true)
          if [ "$EVENTO" = "schedule" ] && { [ "$ORA" -lt 7 ] || [ "$ORA" -ge 11 ]; }; then
            echo "Sono le $ORA in Italia: fuori dall'orario 7-11, questa partenza la salto."
            echo "vai=no" >> "$GITHUB_OUTPUT"
          elif [ "$EVENTO" = "schedule" ] && [ "$ULTIMA" = "$OGGI" ]; then
            echo "Il menu di oggi ($OGGI) è già stato mandato: questa partenza la salto."
            echo "vai=no" >> "$GITHUB_OUTPUT"
          else
            echo "Sono le $ORA in Italia: parto."
            echo "vai=si" >> "$GITHUB_OUTPUT"
          fi
          # Il menu si legge al mattino o quando lo lanci a mano, non quando modifichi la pagina
          if [ "$EVENTO" = "push" ]; then
            echo "leggi=no" >> "$GITHUB_OUTPUT"
          else
            echo "leggi=si" >> "$GITHUB_OUTPUT"
          fi

  # 2) Legge il menu, pubblica la pagina, manda il link
  menu-e-pagina:
    needs: orario
    if: needs.orario.outputs.vai == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    env:
      TZ: Europe/Rome
      LEGGI: ${{ needs.orario.outputs.leggi }}
    steps:
      - name: Scarica il codice del bot
        uses: actions/checkout@v4

      - name: Prepara Python
        if: env.LEGGI == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        if: env.LEGGI == 'si'
        run: pip install -r requirements.txt

      - name: Legge il menu dal sito e lo salva in docs/menu.json
        if: env.LEGGI == 'si'
        run: python bot.py menu

      - name: Salva menu.json nel repository
        if: env.LEGGI == 'si'
        run: |
          git config user.name "bot-mensa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/menu.json
          git diff --cached --quiet || git commit -m "Menu del $(date +%d/%m/%Y)"
          git push

      - name: Prepara la pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Pubblica la pagina su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v4

      # Il promemoria parte anche se qualcosa sopra è andato storto
      - name: Manda il link su Telegram
        if: always() && env.LEGGI == 'si'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py avvisa
